services:
  postgres:
    image: postgres:16-alpine
    container_name: stad-ops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stadium_ops
    ports:
      - "5432:5432"
    volumes:
      - stad-ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stadium_ops"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  stad-ops-pgdata:

# Tell Netlify where your frontend build output goes
[build]
  publish = "dist"
  command = "npm run build"

# Configure Netlify Functions directory
[functions]
  directory = "netlify/functions"

# Local development server (netlify dev).
#
# Note: `command` is set to `tail -f /dev/null` (a no-op that stays alive)
# because we spawn vite ourselves in scripts/dev.ts and run it in parallel
# with netlify dev. Netlify dev then proxies API requests to vite via
# targetPort. The .netlify/v1 stale react-router-server stub is cleared by
# scripts/dev.ts on each start to avoid the broken "build/server/index.js"
# import in SPA mode.
[dev]
  command = "tail -f /dev/null"
  targetPort = 5173
  port = 8888
  autoLaunch = false
  framework = "#custom"

# Redirect all frontend traffic to index.html for React Router SPA handling.
# API routes (/api/*) are handled by Functions before this redirect applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200